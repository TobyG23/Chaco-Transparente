name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHACO_FINALIDAD_CSV: ""
      CHACO_OBJETO_CSV: ""
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install from frozen lockfile without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: bun audit
      # web:netlify repeats the frozen install, lint, direct typechecks, and tests;
      # then builds, tests the fresh export, generates headers, and inventories it.
      - name: Lint, typecheck, test, and build static export
        run: bun run web:netlify
      - name: Check publication blocks and artifact contents
        run: bun scripts/ci-guard.ts
      - name: Upload reviewed static export for inspection only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chaco-static-export
          path: packages/web/out/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
